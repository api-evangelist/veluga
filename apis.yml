name: Veluga
description: >-
  Veluga (Veluga Brewery Inc.) is a South Korean B2B alcohol wholesale
  distribution platform that connects hospitality business owners with liquor
  suppliers. Operating from Mapo, Seoul, the company runs a wholesale
  marketplace offering real-time wholesale pricing quotes for spirits and craft
  beverages, product recommendations for business owners, wholesale order
  facilitation, and partnership programs for distributors and catering
  services. Veluga positions itself as a transaction and information
  intermediary rather than a direct seller. The company began as a craft-beer
  and snack subscription service and is backed by 500 Global, Kakao Ventures,
  SparkLabs, HL Holdings, and Sema Investment. No public developer API,
  SDK, or developer portal is currently published; this profile captures the
  company identity for the API Evangelist network.
